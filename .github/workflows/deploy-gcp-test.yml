name: Deploy to GCP Cloud Run Test

# Se ejecuta cuando hay un push al branch test
on:
  push:
    branches:
      - test

env:
  PROJECT_ID: sak-wcl
  SERVICE_NAME: sak-backend-test
  REGION: southamerica-east1
  SERVICE_ACCOUNT: sak-wcl-service@sak-wcl.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Autenticarse en GCP
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Configurar Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 4. Deploy a Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source ./sak/backend \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --service-account ${{ env.SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --cpu=1 \
            --memory=1Gi \
            --concurrency=80 \
            --timeout=3600 \
            --min-instances=1 \
            --max-instances=10 \
            --set-secrets="DATABASE_URL=DATABASE_URL_TEST:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,JWT_SECRET=JWT_SECRET:latest" \
            --set-env-vars='ENV=test,OPENAI_CHAT_REPLY_MODEL=gpt-4.1-mini,CORS_ORIGINS=https://sistemika-sak-frontend.vercel.app;https://wcl.vercel.app;http://localhost:3000,CORS_ORIGINS_REGEX=https://.*\\.vercel\\.app,SQLALCHEMY_ECHO=0,GCS_PROJECT_ID=${{ env.PROJECT_ID }},GCS_BUCKET_NAME=sak-wcl-bucket,GCS_INVOICE_FOLDER=facturas'

      # 5. Mostrar URL del servicio
      - name: Show service URL
        run: |
          echo "Deploy test completado"
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)'

